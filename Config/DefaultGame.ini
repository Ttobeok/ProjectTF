[/Script/UnrealEd.ProjectPackagingSettings]
; Only the CQB level and what it references gets cooked, and the pak is compressed.
; The template variant content is dead weight for this sample.
BuildConfiguration=PPBC_Development
bCompressed=True
bSkipEditorContent=True
bCookAll=False
bCookMapsOnly=True
+MapsToCook=(FilePath="/Game/CQB/Lvl_CQB")
; Three assets are referenced only by soft path from C++, so the cooker cannot see them from
; the map and would leave them out of the pak - the weapon would not appear and the AI would
; stand in a bind pose. These directories pull them in. Keep this in step with the
; TSoftObjectPtr/TSoftClassPtr paths in CQBCharacter and WeaponVisualComponent.
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Rifle")
+DirectoriesToAlwaysCook=(Path="/Game/Variant_Shooter/Anims")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
